services:
  backend:
    build: ./backend
    container_name: todo-backend
    ports:
      - "5001:5001"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - todo-db-data:/app/data
    environment:
      - PORT=5001
      - DATABASE_PATH=/app/data/todo.db
    restart: always

  frontend:
    build: ./frontend
    container_name: todo-frontend
    ports:
      - "8080:8080"
    depends_on:
      - backend
    restart: always

volumes:
  todo-db-data:
